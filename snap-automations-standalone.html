 <div id="app"><div class="loader"><div class="loader-logo">snap<span>.</span></div><p>Getting things ready…</p></div></div>
 <script>/** SNAP Automations — browser-safe deterministic prototype engine. No external sending. */
const PROJECTS=['SNAP Mobile','Garage360','South Tower Site','Orchid Clinic'];
const TASK_STATUSES=['Planned','In Progress','In Review','QA Approved','Blocked','Completed'];
const PROJECT_STATUSES=['On Track','At Risk','On Hold','Completed'];
const EVENTS=[
 ['task.status','Task status changes'],['task.created','A new task is created'],['project.status','Project status changes'],['invoice.overdue','An invoice becomes overdue'],['task.due','A task is due soon'],['site.checkin.missed','A site check-in is missed'],['visit.completed','A site visit is completed']
];
const CHANNELS=[['inapp','In-app'],['fcm','Push notification'],['email','Email'],['whatsapp','WhatsApp'],['sms','SMS']];
const RECIPIENTS=[['project_owner','Project owner'],['assignee','Task assignee'],['team','Project team']];
const uid=()=>globalThis.crypto?.randomUUID?.()||'snap-'+Date.now()+'-'+Math.random().toString(36).slice(2,9);
const clone=x=>JSON.parse(JSON.stringify(x));
const hhmm=dt=>new Date(dt).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false});
const dateKey=dt=>{const d=new Date(dt);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const dateTimeLabel=dt=>new Date(dt).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
function blankRule(scope='project',project='SNAP Mobile'){
 return {id:uid(),version:1,createdAt:new Date().toISOString(),title:'',enabled:false,scope,project:scope==='workspace'?'All projects':project,
 trigger:{type:'event',event:'task.status',statuses:['Blocked'],repeat:'daily',at:'09:00',weekday:'Friday'},
 condition:{priority:'Any'},delivery:{mode:'immediate',delayMinutes:120,digestAt:'18:00',recheck:true},
 actions:[{id:uid(),type:'notify',channels:['inapp','fcm'],recipient:'project_owner',message:'{task.title} is now {task.status} in {project.name}.'}],assumptions:[]};
}
const labels=new Map([...EVENTS,...RECIPIENTS,...CHANNELS]);
const label=v=>labels.get(v)||v;
function describeWhen(r){const t=r.trigger;if(t.type==='schedule')return `Every ${t.repeat==='weekdays'?'weekday':t.repeat==='weekly'?t.weekday:t.repeat==='monthly'?'month':'day'} at ${t.at}`;
 let s=label(t.event);if((t.event==='task.status'||t.event==='project.status')&&t.statuses?.length&&!t.statuses.includes('*'))s+=' → '+t.statuses.join(' / ');return s;}
function describeDo(r){let acts=r.actions.map(a=>a.type==='notify'?`Notify ${label(a.recipient)} via ${a.channels.map(label).join(' + ')}`:a.type==='create_task'?'Create a follow-up task':a.type==='comment'?'Add a task comment':a.type==='update_status'?'Update task status':a.type==='report'?'Share a project summary':'Perform action').join(' → ');
 if(r.trigger.type==='schedule')return acts;
 if(r.delivery.mode==='delay')acts=`Wait ${friendlyDuration(r.delivery.delayMinutes)}${r.delivery.recheck?' and recheck':' '} → `+acts;
 if(r.delivery.mode==='digest')acts=`Collect updates → send digest at ${r.delivery.digestAt} → `+acts;
 return acts;}
function friendlyDuration(min){return min%1440===0?`${min/1440} day(s)`:min%60===0?`${min/60} hour(s)`:`${min} minute(s)`;}
function inferTitle(r){const t=r.trigger;if(t.type==='schedule')return r.actions.some(a=>a.type==='report')?'Scheduled project health':'Scheduled work update';if(t.event==='invoice.overdue')return 'Overdue invoice reminder';if(t.event==='task.created')return 'New task follow-up';if(t.event==='site.checkin.missed')return 'Missing check-in alert';if(t.event==='visit.completed')return 'Site visit update';if(r.delivery.mode==='digest')return 'Evening task digest';if(r.delivery.mode==='delay')return 'Delayed escalation';return `${label(t.event)} alert`;}

function input(labelText,name,value,type='text',help=''){return `<div class="form-field"><label for="${esc(name)}">${esc(labelText)}</label><input id="${esc(name)}" data-field="${esc(name)}" type="${esc(type)}" value="${esc(value)}">${help?`<small>${esc(help)}</small>`:''}</div>`}
function tabButton(v,text,active,attr='data-choice'){return `<button type="button" ${attr}="${esc(v)}" class="${active===v?'active':''}">${text}</button>`}
function scopeHTML(){return `<div class="scope-line"><div class="scope-tabs">${tabButton('workspace',ic('home')+' Workspace',scope,'data-scope')}${tabButton('project',ic('layers')+' Project',scope,'data-scope')}</div>${scope==='project'?`<select aria-label="Current project" class="project-select" data-current-project>${PROJECTS.map(p=>`<option ${p===currentProject?'selected':''}>${esc(p)}</option>`).join('')}</select>`:''}</div>`}
function ruleRows(rs){if(!rs.length)return `<div class="empty">No automations in this view yet.<br><button class="text-btn" data-new>＋ Create one</button></div>`;return `<div class="rule-list">${rs.map(r=>`<div class="panel rule-row"><div class="rule-mark">${ic(r.trigger.type==='schedule'?'clock':'zap')}</div><div class="rule-info"><b>${esc(r.title)}</b><p>${esc(describeWhen(r))} &nbsp;→&nbsp; ${esc(describeDo(r))}</p><div class="line-meta" style="margin-top:7px"><span class="small-muted">${esc(r.scope==='workspace'?'Workspace':r.project)}</span><span class="pill ${r.enabled?'live':''}">${r.enabled?'On':'Paused'}</span></div></div><div class="rule-controls"><button class="btn small" data-edit="${r.id}">${ic('settings')}<span class="row-edit-label"> Edit</span></button><button class="btn small" data-toggle="${r.id}" title="${r.enabled?'Pause':'Resume'}" aria-label="${r.enabled?'Pause':'Resume'} ${esc(r.title)}">${ic(r.enabled?'pause':'play')}</button><button class="btn small" data-clone="${r.id}" title="Duplicate" aria-label="Duplicate ${esc(r.title)}">${ic('copy')}</button><button class="btn small danger" data-delete="${r.id}" title="Delete" aria-label="Delete ${esc(r.title)}">${ic('trash')}</button></div></div>`).join('')}</div>`}
function renderHome(){const scoped=state.rules.filter(projectScopeFilter);return `<div class="page-header"><div><span class="crumb">WELCOME TO SNAP AUTOMATIONS</span><h1>Make work happen. Automatically.</h1><p>Just say what you need. SNAP helps you set it up in seconds.</p></div><button class="btn" data-new>${ic('plus')} Create manually</button></div>${scopeHTML()}<div class="prompt-card"><div class="prompt-top"><span class="spark-icon">${ic('spark')}</span> Describe it. SNAP sets it up.</div><label class="hidden" for="prompt">Automation request</label><textarea id="prompt" placeholder="When a task becomes Blocked, notify the project owner…">${esc(promptText)}</textarea><div class="prompt-bottom"><span class="prompt-tip">For example: “Every day at 9 AM email project health.”</span><button class="btn primary" data-prompt-submit>${ic('spark')} Create automation ${ic('arrow')}</button></div></div><div class="section-top"><h2>Start with something useful</h2><button class="text-btn" data-more>${moreRecipes?'Show less':'Explore all recipes'} ${ic('chevron')}</button></div><div class="recipe-grid">${RECIPES.slice(0,moreRecipes?RECIPES.length:4).map((p,i)=>`<button class="recipe" data-recipe="${i}"><span class="recipe-ic">${ic(p.icon)}</span><b>${esc(p.title)}</b><p>${esc(p.description)}</p></button>`).join('')}</div><div class="metric-grid"><div class="panel metric">${ic('zap')}<strong>${scoped.filter(x=>x.enabled).length}</strong><small>Active rules</small></div><div class="panel metric">${ic('clock')}<strong>${state.pending.length}</strong><small>Waiting actions</small></div><div class="panel metric">${ic('history')}<strong>${state.history.length}</strong><small>Recent activities</small></div></div><div class="section-top"><h2>Your automations</h2><button class="text-btn" data-go="rules">View all ${ic('arrow')}</button></div>${ruleRows(scoped.slice(0,5))}${footer()}`}
function footer(){return `<div class="doc-footer">Demo mode: In-app actions update local sample data. FCM, email, WhatsApp and SMS are safe previews only. Scheduled runs require this browser tab to be open. <button class="plain-link" data-go="play">Open Playground →</button></div>`}
function renderRules(){const rows=state.rules.filter(r=>filter==='all'||filter==='workspace'&&r.scope==='workspace'||filter==='project'&&r.scope==='project'||filter==='on'&&r.enabled||filter==='off'&&!r.enabled);return `<div class="page-header"><div><span class="crumb">MY RULES</span><h1>Automations</h1><p>Keep your projects moving while SNAP handles the routine.</p></div><button class="btn primary" data-new>${ic('plus')} New automation</button></div><div class="scope-line">${field('Show','rule-filter',filter,[['all','All automations'],['workspace','Workspace'],['project','Project'],['on','Active'],['off','Paused']])}<button class="btn small" data-export>${ic('download')} Export rules</button><label class="btn small" for="import-file">Import JSON</label><input id="import-file" type="file" accept="application/json,.json" class="hidden"></div>${ruleRows(rows)}${footer()}`}
function renderBuilder(){const r=editor,t=r.trigger;const statusList=t.event==='project.status'?PROJECT_STATUSES:TASK_STATUSES;const triggerOptions=EVENTS;return `<div class="builder-header"><button class="btn small" data-back>← Back</button><div><span class="crumb">SIMPLE RULE BUILDER</span><h1>${editingId?'Edit automation':'New automation'}</h1></div></div><div class="builder-layout"><div><div class="editor-intro">${input('Automation name','title',r.title||inferTitle(r))}</div><div class="builder-flow"><section class="panel builder-card"><div class="card-heading"><span class="stepnum">1</span><strong>When</strong><small>What starts it?</small></div><div class="seg">${tabButton('event','Something happens',t.type,'data-trigger-type')}${tabButton('schedule','At a certain time',t.type,'data-trigger-type')}</div>${t.type==='event'?`<div class="form-grid">${sel('Event','trigger.event',t.event,triggerOptions)}</div>${['task.status','project.status'].includes(t.event)?`<div class="form-field"><label>Changes to (choose one or more)</label><div class="chips"><button class="chip ${t.statuses.includes('*')?'selected':''}" data-status="*">Any status</button>${statusList.map(x=>`<button class="chip ${t.statuses.includes(x)?'selected':''}" data-status="${esc(x)}">${esc(x)}</button>`).join('')}</div></div>`:''}`:`<div class="form-grid">${sel('Repeat','trigger.repeat',t.repeat,[['daily','Every day'],['weekdays','Weekdays'],['weekly','Every week'],['monthly','Every month (1st)']])}${input('Time','trigger.at',t.at,'time')}</div>${t.repeat==='weekly'?sel('On','trigger.weekday',t.weekday||'Friday',['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday']):''}`}<div class="subtle-rule"></div><div class="form-grid">${sel('Scope','scope',r.scope,[['project','One project'],['workspace','Workspace']])}${sel('Project','project',r.project,[['All projects','All projects'],...PROJECTS.map(p=>[p,p])])}</div><button class="disclose" data-advanced>${ic('settings')} ${advanced?'Hide optional condition':'Add optional condition'} ${ic('chevron')}</button>${advanced?sel('Only if priority is','condition.priority',r.condition.priority,['Any','Low','Normal','High','Critical']):''}</section><section class="panel builder-card"><div class="card-heading"><span class="stepnum">2</span><strong>Do</strong><small>What should SNAP do?</small></div>${r.actions.map((a,i)=>renderAction(a,i)).join('')}<button class="disclose" data-add-action>${ic('plus')} Add another action</button>${t.type==='event'?`<div class="subtle-rule"></div><div class="form-field"><label>When should it happen?</label><div class="seg">${tabButton('immediate','Immediately',r.delivery.mode,'data-delivery')}${tabButton('delay','After a delay',r.delivery.mode,'data-delivery')}${tabButton('digest','One combined update',r.delivery.mode,'data-delivery')}</div></div>${r.delivery.mode==='delay'?`<div class="form-grid">${input('Wait (minutes)','delivery.delayMinutes',r.delivery.delayMinutes,'number')}</div><label class="check"><input type="checkbox" data-field="delivery.recheck" ${r.delivery.recheck?'checked':''}> Recheck current status before sending</label>`:r.delivery.mode==='digest'?`<div class="form-grid">${input('Deliver the combined updates at','delivery.digestAt',r.delivery.digestAt,'time')}</div><span class="dev-note">All matching events are collected, then summarized as one update.</span>`:''}`:''}</section></div><div class="builder-actions"><button class="btn" data-save-draft>Save draft</button><button class="btn primary" data-activate>${ic('check')} ${r.enabled?'Save & keep on':'Turn on'}</button></div></div><aside class="builder-sticky"><section class="panel builder-card"><span class="preview-title">YOUR AUTOMATION, IN PLAIN ENGLISH</span><div class="sentence">When: <em>${esc(describeWhen(r))}</em><br>Where: <em>${esc(r.project)}</em><br>Do: <em>${esc(describeDo(r))}</em></div><div class="note">${ic('spark')} SNAP will interpret your request into these editable settings. Nothing runs until you choose Turn on.</div>${r.assumptions?.length?`<div class="suggestions"><b>✦ Suggested settings</b>${r.assumptions.map(a=>`<p>• ${esc(a.text)}</p>`).join('')}<div class="small-muted">You can edit any suggestion above.</div></div>`:''}<div class="preview-footer"><button class="btn full" data-try>${ic('play')} Try with sample data</button><div class="small-muted">Tests are safe. Actual external messages are not sent.</div></div></section><div class="warning" style="margin-top:12px">${ic('bell')} FCM, email, WhatsApp and SMS are shown as previews until a secure backend is connected.</div></aside></div>`}
function renderAction(a,i){const typeopts=[['notify','Send notification'],['report','Share project report'],['create_task','Create follow-up task'],['comment','Add task comment'],['update_status','Change task status']];return `<div class="action-card"><div class="action-title"><b>${i+1}. ${esc(typeopts.find(x=>x[0]===a.type)?.[1]||'Action')}</b>${i?`<button data-remove-action="${i}" aria-label="Remove action">${ic('trash')}</button>`:''}</div><div class="form-grid">${sel('Action',`actions.${i}.type`,a.type,typeopts)}</div>${a.type==='notify'||a.type==='report'?`<div class="form-grid">${sel('Send to',`actions.${i}.recipient`,a.recipient||'project_owner',RECIPIENTS)}${a.type==='report'?sel('Report',`actions.${i}.reportType`,a.reportType||'health',[['health','Project health'],['tomorrow','Tomorrow’s priorities']]):''}</div><div class="form-field"><label>Via</label><div class="chips">${CHANNELS.map(([v,name])=>`<button class="chip ${(a.channels||[]).includes(v)?'selected':''}" data-action-channel="${i}:${v}">${esc(name)}</button>`).join('')}</div></div>${a.type==='notify'?`<div class="form-grid">${input('Message',`actions.${i}.message`,a.message||'Update: {task.title} in {project.name}.')}</div>`:''}`:a.type==='create_task'?input('New task name',`actions.${i}.taskTitle`,a.taskTitle||'Follow up: {task.title}'):a.type==='comment'?input('Comment text',`actions.${i}.message`,a.message||'Please review {task.title}.'):sel('New task status',`actions.${i}.newStatus`,a.newStatus||'In Progress',TASK_STATUSES)}</div>`}
function renderPlay(){const tasks=state.tasks.filter(t=>t.project===currentProject);const pro=state.projects.find(p=>p.name===currentProject);return `<div class="page-header"><div><span class="crumb">HANDS-ON DEMO</span><h1>Playground</h1><p>Change sample work and watch real local automations respond.</p></div><button class="btn small" data-reset>${ic('settings')} Reset sample data</button></div><div class="scope-line"><select class="project-select" data-current-project aria-label="Select sample project">${PROJECTS.map(p=>`<option ${p===currentProject?'selected':''}>${esc(p)}</option>`).join('')}</select><span class="pill demo">Sample projects only</span></div><div class="play-grid"><div><div class="panel play-panel"><div class="split-heading"><div><h2 class="subhead" style="margin:0">Live sample tasks</h2><div class="small-muted">Change a status to fire an actual local event.</div></div><button class="btn small" data-new-task>${ic('plus')} New task</button></div>${tasks.map(t=>`<div class="play-task"><div><b>${esc(t.title)}</b><p>${esc(t.id)} · ${esc(t.assignee)} · ${esc(t.priority)} priority · ${esc(t.project)}</p></div><select aria-label="Change status for ${esc(t.title)}" data-task-status="${esc(t.id)}">${TASK_STATUSES.map(s=>`<option ${s===t.status?'selected':''}>${esc(s)}</option>`).join('')}</select></div>`).join('')||'<div class="empty">No tasks yet. Add one to begin.</div>'}</div><div class="panel play-panel" style="margin-top:15px"><h2 class="subhead">Other business events</h2><div class="form-grid">${sel('Project status','sample-project-status',pro?.status||'On Track',PROJECT_STATUSES)}${currentProject==='Garage360'?'<div class="form-field"><label>Sample invoice</label><button class="btn full" data-invoice-overdue>Mark invoice overdue</button></div>':'<div class="form-field"><label>Site/field event</label><button class="btn full" data-missed-checkin>Missed site check-in</button></div>'}</div><div class="play-action"><button class="btn small" data-visit-complete>Site visit completed</button><button class="btn small" data-task-due>Task due soon</button></div></div></div><aside class="play-box"><section class="panel play-panel"><h2 class="subhead">Demo clock</h2><div class="clock">${ic('clock')}<strong>${esc(dateTimeLabel(now()))}</strong></div><div class="small-muted" style="margin:11px 0">Move time forward to complete delayed alerts and scheduled updates. The clock changes only in this demo.</div><div class="play-action"><button class="btn small" data-advance="1">+1 hour</button><button class="btn small" data-advance="2">+2 hours</button><button class="btn small" data-advance="24">+1 day</button></div><div class="subtle-rule"></div><div class="play-action"><button class="btn small" data-run-schedule>Run scheduled reports now</button><button class="btn small" data-flush>Send collected digests</button></div><div class="small-muted" style="margin-top:8px">Manual runs execute sample-data actions. They do not send external messages.</div></section><section class="panel play-panel"><div class="split-heading"><h2 class="subhead" style="margin:0">Notification inbox</h2><span class="pill">${state.inbox.length} total</span></div>${state.inbox.length?`<ul class="play-inbox">${state.inbox.slice(0,4).map(x=>`<li>${esc(x.text.slice(0,145))}<br><small>${esc(dateTimeLabel(x.at))}</small></li>`).join('')}</ul>`:'<div class="small-muted">In-app notifications appear here after a matching rule fires.</div>'}<button class="text-btn" data-inbox>View inbox →</button></section><section class="panel play-panel"><h2 class="subhead">Waiting & collected</h2><div class="short-stat">${state.pending.length} delayed execution(s) waiting</div><div class="short-stat">${Object.values(state.digests).reduce((a,b)=>a+b.length,0)} event(s) waiting for a digest</div><button class="text-btn" data-go="activity">View activity →</button></section></aside></div>${footer()}`}
function renderActivity(){const list=state.history.slice(0,120);return `<div class="page-header"><div><span class="crumb">TRANSPARENT EXECUTION</span><h1>Activity</h1><p>See what happened, what is still waiting, and what was only simulated.</p></div><button class="btn small" data-clear-history>${ic('trash')} Clear history</button></div><div class="panel play-panel"><div class="line-meta" style="margin-bottom:14px"><span class="pill live">Completed in this demo</span><span class="pill demo">External channel preview</span><span class="pill wait">Waiting / skipped</span></div>${list.length?list.map(l=>`<div class="activity-item"><span class="activity-mark ${l.status==='simulated'?'simulated':l.status==='waiting'||l.status==='skipped'?'skipped':''}">${ic(l.status==='simulated'?'mail':l.status==='waiting'?'clock':'check')}</span><div><div class="activity-head"><b>${esc(l.title)}</b><span class="pill ${l.status==='success'?'live':l.status==='waiting'?'wait':'demo'}">${esc(l.status==='simulated'?'Preview only':l.status)}</span></div><p>${esc(l.detail)}</p><small>${esc(dateTimeLabel(l.at))}${l.project?' · '+esc(l.project):''}</small></div></div>`).join(''):'<div class="empty">No activity yet. Open Playground and change a task status.</div>'}</div>${footer()}`}
function renderNav(){const nav=[['home','Overview','home'],['rules','Automations','zap'],['play','Playground','play'],['activity','Activity','history']];return nav.map(([p,title,i])=>`<button class="nav-btn ${page===p||p==='rules'&&page==='builder'?'active':''}" data-go="${p}">${ic(i)} ${title}</button>`).join('')}
function render(){document.title='snap · Automations MVP';const inner=page==='home'?renderHome():page==='rules'?renderRules():page==='builder'&&editor?renderBuilder():page==='play'?renderPlay():renderActivity();document.getElementById('app').innerHTML=`<div class="app-shell"><aside class="sidebar"><div class="brand"><span class="wordmark">snap<span>.</span></span><small>AUTOMATIONS</small></div><nav class="nav-group" aria-label="Primary navigation">${renderNav()}</nav><div class="sidebar-foot"><strong>Simple by design.</strong><br>Powerful behind the scenes.<br><br>Local MVP · v1.0</div></aside><div class="main-shell"><header class="topbar"><div class="bread">snap / <b>${esc(page==='builder'?'New automation':nms[['home','rules','play','activity'].indexOf(page)]||'Automations')}</b></div><div class="top-actions"><span class="top-lite">LOCAL WORKSPACE DEMO</span><button class="icon-btn" data-inbox aria-label="Notification inbox">${ic('bell')}${state.inbox.length?'<span class="dot"></span>':''}</button><button class="icon-btn" data-export aria-label="Export rules">${ic('download')}</button></div></header><main class="content">${inner}</main></div></div><nav class="bottom-nav" aria-label="Mobile navigation">${renderNav()}</nav><div id="modal-slot">${renderModal()}</div>`;}
function initPreview(){const first=state.tasks.find(t=>t.project===editor.project)||state.tasks[0];testInput={event:editor.trigger.type==='schedule'?'schedule':editor.trigger.event,project:editor.project==='All projects'?'SNAP Mobile':editor.project,status:editor.trigger.statuses?.[0]==='*'?'Completed':editor.trigger.statuses?.[0]||'Blocked',taskId:first.id,priority:first.priority,elapsed:editor.delivery.delayMinutes||120,resolved:false,count:5,testTime:editor.trigger.type==='schedule'?editor.trigger.at:editor.delivery.digestAt,day:'Monday'};testResult=null;modal={type:'test'};render()}
function calcPreview(){const r=editor,v=testInput;const task=state.tasks.find(t=>t.id===v.taskId)||state.tasks[0];const evt={id:uid(),type:v.event,project:v.project,toStatus:v.status,task:{...task,project:v.project,priority:v.priority,status:v.status},at:now()};let conditions=[];const add=(ok,text)=>conditions.push({ok,label:text});if(r.trigger.type==='schedule'){add(v.event==='schedule','Schedule selected');add(v.testTime>=r.trigger.at,`Clock has reached ${r.trigger.at}`);if(r.trigger.repeat==='weekdays')add(!['Saturday','Sunday'].includes(v.day),'Business weekday');if(r.trigger.repeat==='weekly')add(v.day===r.trigger.weekday,`Scheduled day: ${r.trigger.weekday}`);}else{conditions=matchEvent(r,evt).reasons;if(r.delivery.mode==='delay'){add(+v.elapsed>=+r.delivery.delayMinutes,`Waited ${friendlyDuration(r.delivery.delayMinutes)}`);if(r.delivery.recheck)add(!v.resolved,'Task still needs attention');}if(r.delivery.mode==='digest'){add(+v.count>0,'Digest contains matching updates');add(v.testTime>=r.delivery.digestAt,`Delivery time reached (${r.delivery.digestAt})`);}}
 const ok=conditions.every(x=>x.ok);let messages=[];if(ok){for(const a of r.actions){if(a.type==='notify'||a.type==='report'){const txt=a.type==='report'?reportText(state,r.project,a.reportType):r.delivery.mode==='digest'?`SNAP updates: ${v.count} matching changes in ${v.project}`:expandTokens(a.message,evt);messages.push({type:'message',text:`${a.type==='report'?'Report':'Notification'} · ${a.channels.map(label).join(', ')}\nTo: ${label(a.recipient)}\n\n${txt}`})}else messages.push({type:'change',text:a.type==='create_task'?'Would create a follow-up task':a.type==='comment'?'Would add a task comment':`Would update task status to ${a.newStatus}`})}}
 return {ok,conditions,messages};}
function renderModal(){if(!modal)return '';if(modal.type==='test'){let v=testInput,r=editor;return `<div class="overlay" data-overlay><section class="dialog" role="dialog" aria-modal="true" aria-label="Try automation"><div class="dialog-head"><div><span class="crumb">SAFE TEST</span><h2>Try your automation</h2><p>Adjust a sample event. Nothing external is sent.</p></div><button class="icon-btn" data-close-modal aria-label="Close">${ic('close')}</button></div><div class="form-grid">${sel('Example event','test.event',v.event,[['schedule','Schedule time'],...EVENTS])}${sel('Project','test.project',v.project,PROJECTS)}</div>${r.trigger.type==='event'&&['task.status','project.status'].includes(r.trigger.event)?`<div class="form-grid">${sel('New status','test.status',v.status,r.trigger.event==='project.status'?PROJECT_STATUSES:TASK_STATUSES)}${sel('Task priority','test.priority',v.priority,['Low','Normal','High','Critical'])}</div>`:''}${r.trigger.type==='schedule'?`<div class="form-grid">${input('Example time','test.testTime',v.testTime,'time')}${sel('Example day','test.day',v.day,['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'])}</div>`:''}${r.trigger.type==='event'&&r.delivery.mode==='delay'?`<div class="form-grid">${input('Minutes elapsed','test.elapsed',v.elapsed,'number')}<div class="form-field"><label>Current task condition</label><label class="check"><input type="checkbox" data-field="test.resolved" ${v.resolved?'checked':''}> Task was resolved before delivery</label></div></div>`:''}${r.trigger.type==='event'&&r.delivery.mode==='digest'?`<div class="form-grid">${input('Events collected','test.count',v.count,'number')}${input('Example time','test.testTime',v.testTime,'time')}</div>`:''}<div class="dialog-actions"><button class="btn primary" data-preview>${ic('play')} Run safe test</button><button class="btn" data-close-modal>Done</button></div>${testResult?`<div class="test-result"><div class="result-head ${testResult.ok?'':'no'}">${ic(testResult.ok?'check':'clock')} ${testResult.ok?'Matched — this automation would run':'Not matched — no action would run'}</div>${testResult.conditions.map(c=>`<div class="reason"><span class="${c.ok?'ok':'no'}">${c.ok?'✓':'×'}</span> ${esc(c.label)}</div>`).join('')}${testResult.ok?testResult.messages.map(m=>`<div class="message-preview">${esc(m.text)}</div>`).join(''):'<p>Change a sample value and try again to see a successful match.</p>'}<p class="small-muted">This is a preview, not a delivery. Use Playground to trigger actual local changes.</p></div>`:''}</section></div>`}
 if(modal.type==='inbox')return `<div class="overlay" data-overlay><section class="dialog" role="dialog" aria-modal="true" aria-label="Notification inbox"><div class="dialog-head"><h2>In-app notifications</h2><button class="icon-btn" data-close-modal>${ic('close')}</button></div>${state.inbox.length?state.inbox.map(n=>`<div class="activity-item"><span class="activity-mark">${ic('bell')}</span><div><b>${esc(n.recipient)}</b><p>${esc(n.text)}</p><small>${esc(dateTimeLabel(n.at))} · ${esc(n.project)}</small></div></div>`).join(''):'<p>No notifications yet. Change a status in the Playground.</p>'}</section></div>`;
 if(modal.type==='confirm')return `<div class="overlay" data-overlay><section class="dialog" role="dialog" aria-modal="true" aria-label="Confirm change"><div class="dialog-head"><h2>${esc(modal.title)}</h2><button class="icon-btn" data-close-modal>${ic('close')}</button></div><p>${esc(modal.message)}</p><div class="dialog-actions"><button class="btn" data-close-modal>Cancel</button><button class="btn primary" data-confirm>Continue</button></div></section></div>`;
 if(modal.type==='task')return `<div class="overlay" data-overlay><section class="dialog" role="dialog" aria-modal="true" aria-label="Add sample task"><div class="dialog-head"><h2>Add a sample task</h2><button class="icon-btn" data-close-modal>${ic('close')}</button></div>${input('Task title','new.title',modal.title||'Follow up with the team')}${sel('Priority','new.priority',modal.priority||'Normal',['Low','Normal','High','Critical'])}<div class="dialog-actions"><button class="btn primary" data-create-task>Save sample task</button><button class="btn" data-close-modal>Cancel</button></div></section></div>`;
 if(modal.type==='clarify'){return `<div class="overlay" data-overlay><section class="dialog" role="dialog" aria-modal="true" aria-label="Clarify automation"><div class="dialog-head"><h2>Just one quick question</h2><button class="icon-btn" data-close-modal>${ic('close')}</button></div><p>${esc(clarify.question)}</p><div class="dialog-actions">${clarify.options.map(o=>`<button class="btn primary" data-clarify="${esc(o.value)}">${esc(o.label)} (${esc(o.value)})</button>`).join('')}</div></section></div>`}
 return '';
}
function editRule(r,existing=null){editor=clone(r);editingId=existing;advanced=editor.condition.priority!=='Any';page='builder';modal=null;render();window.scrollTo(0,0)}
function startPrompt(p){promptText=p;const x=interpretPrompt(p,scope,currentProject);if(x.error){notify(x.error);return}if(x.clarification){editor=x.rule;clarify=x.clarification;modal={type:'clarify'};render();return}editRule(x.rule)}
function saveRule(enable){if(!editor)return;editor.title=editor.title.trim()||inferTitle(editor);if(editor.scope==='project'&&editor.project==='All projects'){notify('Choose a project or switch to Workspace.');return}const issues=validateRule(editor);if(issues.length){notify(issues[0]);return}if(enable&&editor.scope==='workspace'&&editor.project==='All projects'&&!editingId){modal={type:'confirm',title:'Turn on across all projects?',message:'This automation covers every project in the workspace. For this static demo, external messages are previewed only.',onConfirm:'save-enable'};render();return}finishSave(enable)}
function finishSave(enable){editor.enabled=enable;editor.version=(editor.version||0)+1;const idx=state.rules.findIndex(r=>r.id===editingId);if(idx>=0)state.rules[idx]=clone(editor);else state.rules.unshift(clone(editor));persist();const savedTitle=editor.title;editor=null;editingId=null;page='home';modal=null;render();notify(`${savedTitle} ${enable?'turned on':'saved as draft'}`)}
function doDeletion(id){state.rules=state.rules.filter(r=>r.id!==id);state.pending=state.pending.filter(p=>p.ruleId!==id);delete state.digests[id];persist();render();notify('Automation deleted')}
function exportData(){const data={format:'snap-automation-export',version:1,exportedAt:new Date().toISOString(),rules:state.rules};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const href=URL.createObjectURL(blob);const a=document.createElement('a');a.href=href;a.download='snap-automation-rules.json';a.click();setTimeout(()=>URL.revokeObjectURL(href),1000);notify('Automation rules exported')}
function importRules(text){const data=JSON.parse(text);if(data?.format!=='snap-automation-export'||!Array.isArray(data.rules)||data.rules.length>100)throw Error('Unsupported import format or too many rules.');let count=0;for(const raw of data.rules){if(typeof raw!=='object'||!raw||!raw.trigger||!raw.actions||!Array.isArray(raw.actions))continue;const r=clone(raw);r.id=uid();r.enabled=false;r.actions=r.actions.slice(0,5).map(x=>({...x,id:uid()}));r.title=String(r.title||inferTitle(r)).slice(0,120);if(validateRule(r).length)continue;state.rules.push(r);count++}persist();render();notify(`${count} rule(s) imported as paused drafts`)}
function handleClick(e){const b=e.target.closest('button');if(!b)return;const attr=n=>b.getAttribute(n);if(b.hasAttribute('data-go')){page=attr('data-go');editor=null;modal=null;render();window.scrollTo(0,0);return}if(b.hasAttribute('data-scope')){scope=attr('data-scope');persist();render();return}if(b.hasAttribute('data-new')){editRule(blankRule(scope,currentProject));return}if(b.hasAttribute('data-more')){moreRecipes=!moreRecipes;render();return}if(b.hasAttribute('data-recipe')){startPrompt(RECIPES[Number(attr('data-recipe'))].prompt);return}if(b.hasAttribute('data-prompt-submit')){promptText=document.getElementById('prompt')?.value||'';startPrompt(promptText);return}if(b.hasAttribute('data-back')){editor=null;page='home';render();return}
 if(b.hasAttribute('data-edit')){const r=state.rules.find(x=>x.id===attr('data-edit'));if(r)editRule(r,r.id);return}
 if(b.hasAttribute('data-toggle')){const r=state.rules.find(x=>x.id===attr('data-toggle'));if(r){r.enabled=!r.enabled;persist();render();notify(r.enabled?'Automation resumed':'Automation paused')}return}
 if(b.hasAttribute('data-clone')){const r=state.rules.find(x=>x.id===attr('data-clone'));if(r){const c=clone(r);c.id=uid();c.title=r.title+' (copy)';c.enabled=false;c.createdAt=new Date().toISOString();c.actions.forEach(x=>x.id=uid());state.rules.unshift(c);persist();render();notify('Duplicate saved as paused draft')}return}
 if(b.hasAttribute('data-delete')){modal={type:'confirm',title:'Delete this automation?',message:'This also cancels any waiting actions for this rule. Other rules will not be affected.',onConfirm:'delete',id:attr('data-delete')};render();return}
 if(b.hasAttribute('data-status')){const x=attr('data-status');if(x==='*')editor.trigger.statuses=['*'];else{const s=editor.trigger.statuses.filter(y=>y!=='*');editor.trigger.statuses=s.includes(x)?s.filter(y=>y!==x):[...s,x];if(!editor.trigger.statuses.length)editor.trigger.statuses=['*']}editor.assumptions=[];render();return}
 if(b.hasAttribute('data-trigger-type')){editor.trigger.type=attr('data-trigger-type');if(editor.trigger.type==='schedule')editor.delivery.mode='immediate';render();return}
 if(b.hasAttribute('data-delivery')){editor.delivery.mode=attr('data-delivery');render();return}
 if(b.hasAttribute('data-advanced')){advanced=!advanced;render();return}
 if(b.hasAttribute('data-action-channel')){const [i,c]=attr('data-action-channel').split(':');const a=editor.actions[Number(i)];a.channels=a.channels||[];a.channels=a.channels.includes(c)?a.channels.filter(x=>x!==c):[...a.channels,c];editor.assumptions=[];render();return}
 if(b.hasAttribute('data-add-action')){if(editor.actions.length>=5){notify('Maximum five actions per automation');return}editor.actions.push({id:uid(),type:'notify',channels:['inapp'],recipient:'assignee',message:'New update in {project.name}: {task.title}'});render();return}
 if(b.hasAttribute('data-remove-action')){editor.actions.splice(Number(attr('data-remove-action')),1);render();return}
 if(b.hasAttribute('data-save-draft')){saveRule(false);return}if(b.hasAttribute('data-activate')){saveRule(true);return}if(b.hasAttribute('data-try')){const errors=validateRule(editor);if(errors.length){notify(errors[0]);return}initPreview();return}
 if(b.hasAttribute('data-close-modal')){modal=null;testResult=null;clarify=null;render();return}
 if(b.hasAttribute('data-clarify')){if(editor&&clarify){if(clarify.field==='trigger.at')editor.trigger.at=attr('data-clarify');else editor.delivery.digestAt=attr('data-clarify');editor.assumptions=editor.assumptions.filter(x=>x.field!==clarify.field);clarify=null;editRule(editor)}return}
 if(b.hasAttribute('data-preview')){testResult=calcPreview();log({title:'Safe test '+(testResult.ok?'matched':'skipped'),detail:`${editor.title||inferTitle(editor)} · No actions sent`,status:'simulated',project:testInput.project});persist();render();return}
 if(b.hasAttribute('data-confirm')){const m=modal;modal=null;if(m.onConfirm==='delete')doDeletion(m.id);else if(m.onConfirm==='save-enable')finishSave(true);else if(m.onConfirm==='reset'){state=seed();persist();render();notify('Sample workspace reset')}else if(m.onConfirm==='clear'){state.history=[];persist();render()}return}
 if(b.hasAttribute('data-inbox')){modal={type:'inbox'};render();return}
 if(b.hasAttribute('data-new-task')){modal={type:'task',title:'Follow up with the team',priority:'Normal'};render();return}
 if(b.hasAttribute('data-create-task')){const title=(modal.title||'New sample task').trim();if(!title){notify('Enter a task title');return}const task={id:'T-'+String(Math.floor(Math.random()*8000)+1000),project:currentProject,title,status:'Planned',priority:modal.priority||'Normal',assignee:'Asha',due:now()+86400000,comments:[]};state.tasks.unshift(task);modal=null;const count=handleEvent(sampleEvent(task,'','task.created'));persist();render();notify(`Task added · ${count} matching automation(s)`);return}
 if(b.hasAttribute('data-advance')){state.clockOffset+=Number(attr('data-advance'))*3600000;const result=tick();render();notify(`Clock advanced · ${result.delayed+result.scheduled+result.digests} automation(s) executed`);return}
 if(b.hasAttribute('data-run-schedule')){const n=runSchedules(true);persist();render();notify(`${n} scheduled automation(s) run locally`);return}
 if(b.hasAttribute('data-flush')){const n=dueDigests(true);persist();render();notify(`${n} digest(s) processed`);return}
 if(b.hasAttribute('data-invoice-overdue')){const inv=state.invoices.find(x=>x.project===currentProject)||{id:'INV-NEW',project:currentProject,amount:'₹ 8,900',overdue:false};inv.overdue=true;const e={id:uid(),type:'invoice.overdue',project:currentProject,invoice:clone(inv),path:[],depth:0};const n=handleEvent(e);render();notify(`Invoice marked overdue · ${n} rule(s) matched`);return}
 if(b.hasAttribute('data-missed-checkin')){const n=handleEvent({id:uid(),type:'site.checkin.missed',project:currentProject,path:[],depth:0});render();notify(`Missing check-in event · ${n} rule(s) matched`);return}
 if(b.hasAttribute('data-visit-complete')){const n=handleEvent({id:uid(),type:'visit.completed',project:currentProject,path:[],depth:0});render();notify(`${n} rule(s) matched`);return}
 if(b.hasAttribute('data-task-due')){const t=state.tasks.find(x=>x.project===currentProject);const n=handleEvent(sampleEvent(t||{project:currentProject,title:'Due task',priority:'Normal',status:'Planned'},'','task.due'));render();notify(`${n} rule(s) matched`);return}
 if(b.hasAttribute('data-reset')){modal={type:'confirm',title:'Reset the sample workspace?',message:'This clears the local demo rules, tasks, history and notification inbox.',onConfirm:'reset'};render();return}
 if(b.hasAttribute('data-clear-history')){modal={type:'confirm',title:'Clear execution history?',message:'This clears history only. Active rules and pending actions will remain.',onConfirm:'clear'};render();return}
 if(b.hasAttribute('data-export')){exportData();return}}
function handleChange(e){const x=e.target;if(x.matches('[data-current-project]')){currentProject=x.value;persist();render();return}if(x.matches('[data-task-status]')){const t=state.tasks.find(v=>v.id===x.dataset.taskStatus);if(!t||t.status===x.value)return;const old=t.status;t.status=x.value;log({title:'Sample task changed',detail:`${t.title}: ${old} → ${t.status}`,status:'success',project:t.project});const n=handleEvent(sampleEvent(t,t.status));persist();render();notify(`${n} matching automation(s) triggered`);return}if(x.matches('[data-field]')){const k=x.dataset.field,v=x.type==='checkbox'?x.checked:x.type==='number'?Number(x.value):x.value;if(k==='rule-filter'){filter=v;render();return}if(k==='sample-project-status'){const p=state.projects.find(t=>t.name===currentProject);if(p){p.status=v;const n=handleEvent({id:uid(),type:'project.status',project:currentProject,toStatus:v,path:[],depth:0});persist();render();notify(`${n} project automation(s) triggered`)}return}
 if(k.startsWith('test.')&&testInput){testInput[k.slice(5)]=v;testResult=null;render();return}if(k.startsWith('new.')&&modal?.type==='task'){modal[k.slice(4)]=v;return}if(!editor)return;const path=k.split('.');let target=editor;for(let i=0;i<path.length-1;i++)target=target[path[i]];const leaf=path[path.length-1];target[leaf]=v;if(k==='scope'&&v==='workspace')editor.project='All projects';if(k==='scope'&&v==='project'&&editor.project==='All projects')editor.project=currentProject;if(k==='project'&&v==='All projects')editor.scope='workspace';if(k==='project'&&v!=='All projects')editor.scope='project';if(k==='trigger.event'){editor.trigger.statuses=(v==='task.status'||v==='project.status')?['Blocked']:['*'];if(v==='project.status')editor.trigger.statuses=['At Risk'];}if(k.endsWith('.type')&&k.startsWith('actions.')){const i=Number(path[1]);const a=editor.actions[i];if(a.type==='notify'||a.type==='report'){a.channels=a.channels?.length?a.channels:['inapp'];a.recipient=a.recipient||'project_owner';if(a.type==='report')a.reportType=a.reportType||'health';else a.message=a.message||'{task.title} has changed in {project.name}.';}if(a.type==='update_status')a.newStatus=a.newStatus||'In Progress';if(a.type==='create_task')a.taskTitle=a.taskTitle||'Follow up: {task.title}';}
 editor.assumptions=[];render();return}}
function handleInput(e){if(e.target.id==='prompt')promptText=e.target.value;}
async function handleImport(e){if(e.target.id!=='import-file'||!e.target.files?.[0])return;try{const text=await e.target.files[0].text();if(text.length>300000)throw Error('Import file too large (limit: 300 KB)');importRules(text)}catch(err){notify(`Import failed: ${err.message}`)}e.target.value=''}
document.addEventListener('click',e=>{if(e.target.matches('[data-overlay]')){modal=null;testResult=null;render();return}handleClick(e)});
document.addEventListener('change',e=>{handleChange(e);handleImport(e)});document.addEventListener('input',handleInput);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){modal=null;render()}if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)&&page==='home'){promptText=document.getElementById('prompt')?.value||'';startPrompt(promptText)}});
window.SNAP_DEMO={getData:()=>clone(state),getView:()=>page,handleEvent,runSchedules,executePending,dueDigests,tick,reset:()=>{state=seed();persist();render()},interpretPrompt,matchEvent};
tick();render();setInterval(()=>{if(document.visibilityState==='visible'&&page!=='builder'){const was=state.history.length;tick();if(state.history.length!==was)render()}},30000);
</script>
